#
#  tmux.conf  --  TMux-Konfiguration
#

%if "#{==:#{ruby_support},1}"

run-ruby -n -F '$:.unshift "#{current_file}.d"'
run-ruby -n    'require "upinfo"'
run-ruby -n    'Tmux.battery = "BAT"'

set-option -g status-right '#{=-132:pane_title}  #(ruby:Tmux.upinfo hide: :s)  %H:%M %d.%m.%Y'


%elif "#{!=:#{lua_support},}"

run-lua -n -F 'package.path = package.path..";#{current_file}.d/?.lua"'

%if '#{m/r:\<5\.?[3-9]\>,#{lua_support}}'
run-lua -n    'ui = require("upinfo")'
run-lua -n    'ui.set_battery("BAT")'
%else
display-message 'Please edit upinfo.lua and make it #{lua_support} compatible.'
display-message 'Then remove this message.'
%endif

set-option -g status-right '#{=-132:pane_title}  #(lua:ui.upinfo({hide="s"}))  %H:%M %d.%m.%Y'


%endif

